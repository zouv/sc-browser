<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <title>历史记录</title>
  <link rel="stylesheet" href="../common/base.css" />
  <link rel="stylesheet" href="history.css" />
</head>

<body>
  <div class="page">
    <header class="page-header">
      <div>
        <h1 class="page-title">历史记录</h1>
        <p class="page-subtitle" id="summary">加载中…</p>
      </div>
      <div class="header-actions">
        <select class="input" id="range" title="时间范围">
          <option value="all">全部时间</option>
          <option value="today">今天</option>
          <option value="7d">近 7 天</option>
          <option value="30d">近 30 天</option>
        </select>
        <input class="input search-input" id="search" type="search" placeholder="搜索历史记录" />
        <button class="btn" id="clear-data" title="打开设置页清除浏览数据">清除浏览数据…</button>
        <button class="btn btn-danger" id="delete-selected" hidden>删除所选</button>
        <button class="btn btn-danger" id="clear-all">清除全部</button>
      </div>
    </header>

    <div class="list" id="list"></div>
  </div>

  <script src="../common/browser-api.js"></script>
  <script src="history.js"></script>
</body>

</html>
