<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title description">
  <title id="title">SC-Browser application icon</title>
  <desc id="description">A refined blue globe with a soft ocean gradient, faint graticule, muted continents and a gentle terminator, wrapped by a thin orbital ring. An icy S and turquoise C monogram sits on top. Everything outside the sphere is transparent.</desc>
  <defs>
    <radialGradient id="ocean" cx="0" cy="0" r="1" gradientTransform="translate(176 142) rotate(50) scale(352 352)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3E8FBE"/>
      <stop offset="0.28" stop-color="#1A5E8C"/>
      <stop offset="0.55" stop-color="#0E4066"/>
      <stop offset="0.8" stop-color="#072A44"/>
      <stop offset="1" stop-color="#041826"/>
    </radialGradient>
    <radialGradient id="inner-shadow" cx="0" cy="0" r="1" gradientTransform="translate(256 256) scale(246 246)" gradientUnits="userSpaceOnUse">
      <stop offset="0.72" stop-color="#0A2438" stop-opacity="0"/>
      <stop offset="0.93" stop-color="#0A2438" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0A2438" stop-opacity="0.32"/>
    </radialGradient>
    <radialGradient id="terminator" cx="0" cy="0" r="1" gradientTransform="translate(206 176) rotate(52) scale(332 332)" gradientUnits="userSpaceOnUse">
      <stop offset="0.6" stop-color="#0A2438" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#0A2438" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#081A28" stop-opacity="0.24"/>
    </radialGradient>
    <radialGradient id="specular" cx="0" cy="0" r="1" gradientTransform="translate(168 128) rotate(42) scale(126 82)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="atmosphere" cx="0" cy="0" r="1" gradientTransform="translate(256 256) scale(258 258)" gradientUnits="userSpaceOnUse">
      <stop offset="0.86" stop-color="#5CCBFF" stop-opacity="0"/>
      <stop offset="0.935" stop-color="#5CCBFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#5CCBFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="96" y1="96" x2="428" y2="436" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D6F3FF" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#9ADCF8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#5FBFE8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="continent" x1="110" y1="110" x2="400" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6FC7A4"/>
      <stop offset="0.55" stop-color="#357F68"/>
      <stop offset="1" stop-color="#1B5A49"/>
    </linearGradient>
    <filter id="soft-land" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <linearGradient id="s-ink" x1="134" y1="150" x2="241" y2="355" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F0FCFF"/>
      <stop offset="1" stop-color="#B9E4FF"/>
    </linearGradient>
    <linearGradient id="c-ink" x1="319" y1="156" x2="391" y2="344" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9AFCF0"/>
      <stop offset="0.5" stop-color="#4ED8F7"/>
      <stop offset="1" stop-color="#6C9EFF"/>
    </linearGradient>
    <linearGradient id="orbit-ink" x1="72" y1="340" x2="446" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7FD4FF" stop-opacity="0.02"/>
      <stop offset="0.55" stop-color="#9FE3FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9DFFF2" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="grid-fade" cx="0" cy="0" r="1" gradientTransform="translate(256 256) scale(246 246)" gradientUnits="userSpaceOnUse">
      <stop offset="0.7" stop-color="#FFFFFF"/>
      <stop offset="0.93" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="grid-mask">
      <circle cx="256" cy="256" r="244" fill="url(#grid-fade)"/>
    </mask>
    <clipPath id="globe-clip">
      <circle cx="256" cy="256" r="244"/>
    </clipPath>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#atmosphere)"/>
  <g clip-path="url(#globe-clip)">
    <circle cx="256" cy="256" r="244" fill="url(#ocean)"/>
    <g filter="url(#soft-land)" fill="url(#continent)" fill-opacity="0.38" stroke="#CFF7E4" stroke-opacity="0.12" stroke-width="2">
      <path d="M 86 96 C 128 66 196 70 214 102 C 228 124 206 142 180 146 C 152 150 138 162 114 154 C 90 145 72 120 86 96 Z"/>
      <path d="M 366 92 C 402 80 436 106 442 140 C 448 168 424 186 398 182 C 374 178 356 156 356 132 C 356 114 356 98 366 92 Z"/>
      <path d="M 96 304 C 126 286 166 294 176 320 C 186 346 164 374 136 379 C 106 384 82 358 84 332 C 86 316 88 308 96 304 Z"/>
      <path d="M 336 366 C 366 350 402 366 412 394 C 422 422 398 446 368 446 C 338 446 316 422 318 396 C 320 380 326 372 336 366 Z"/>
    </g>
    <g stroke="#E6F9FF" stroke-opacity="0.09" stroke-width="1.3" mask="url(#grid-mask)">
      <ellipse cx="256" cy="256" rx="244" ry="65.8"/>
      <ellipse cx="256" cy="256" rx="244" ry="140"/>
      <ellipse cx="256" cy="256" rx="244" ry="203.7"/>
      <ellipse cx="256" cy="256" rx="82.7" ry="244"/>
      <ellipse cx="256" cy="256" rx="159.1" ry="244"/>
      <ellipse cx="256" cy="256" rx="214.3" ry="244"/>
    </g>
    <circle cx="256" cy="256" r="244" fill="url(#terminator)"/>
    <circle cx="256" cy="256" r="244" fill="url(#inner-shadow)"/>
    <circle cx="256" cy="256" r="244" fill="url(#specular)"/>
    <circle cx="256" cy="256" r="234.5" fill="none" stroke="#EAF9FF" stroke-opacity="0.07" stroke-width="12"/>
  </g>
  <circle cx="256" cy="256" r="243.5" stroke="url(#rim)" stroke-width="2.5"/>
  <g>
    <ellipse cx="256" cy="256" rx="250" ry="136" transform="rotate(-24 256 256)" stroke="url(#orbit-ink)" stroke-width="2"/>
    <circle cx="452" cy="147" r="5" fill="#B6FFF5"/>
    <circle cx="452" cy="147" r="10" fill="#B6FFF5" fill-opacity="0.16"/>
  </g>
  <g id="monogram" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#041A2E" stroke-opacity="0.36" stroke-width="60" transform="translate(2 3)">
      <path d="M 237 179 C 216 155 174 151 146 168 C 116 186 117 219 150 237 L 210 266 C 246 283 246 316 216 337 C 189 356 147 351 122 327"/>
      <path d="M 399 181 C 374 155 334 151 306 179 C 277 209 277 288 306 320 C 333 350 373 350 399 322"/>
    </g>
    <g stroke-width="44">
      <path id="letter-s" d="M 237 179 C 216 155 174 151 146 168 C 116 186 117 219 150 237 L 210 266 C 246 283 246 316 216 337 C 189 356 147 351 122 327" stroke="url(#s-ink)"/>
      <path id="letter-c" d="M 399 181 C 374 155 334 151 306 179 C 277 209 277 288 306 320 C 333 350 373 350 399 322" stroke="url(#c-ink)"/>
    </g>
  </g>
</svg>
