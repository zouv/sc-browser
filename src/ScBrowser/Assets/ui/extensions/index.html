<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <title>扩展程序</title>
  <link rel="stylesheet" href="../common/base.css" />
  <link rel="stylesheet" href="extensions.css" />
</head>

<body>
  <div class="page">
    <header class="page-header">
      <div>
        <h1 class="page-title">扩展程序</h1>
        <p class="page-subtitle" id="summary">加载中…</p>
      </div>
      <div class="header-actions">
        <button class="btn" id="open-folder">打开扩展目录</button>
        <button class="btn" id="install-folder">加载已解压的扩展</button>
        <button class="btn btn-primary" id="install-crx">安装 .crx 包</button>
      </div>
    </header>

    <div class="install-bar">
      <input class="input" id="store-input" type="url"
             placeholder="粘贴 Chrome / Edge 商店链接，或直接填 32 位扩展 ID" />
      <button class="btn btn-primary" id="install-store">从商店安装</button>
    </div>

    <div class="notice">
      <strong>关于扩展支持的能力边界</strong>
      <ul>
        <li>可以直接从 Chrome 网上应用店 / Edge 加载项商店按链接或 ID 安装：本应用会下载 .crx、
          <strong>校验签名</strong>后解包到受管目录，并把公钥写回 manifest 以保持扩展 ID 不变。</li>
        <li>也可以「加载已解压的扩展」或安装本地 <code>.crx</code>；安装前会列出该扩展申请的权限。</li>
        <li>扩展安装后<strong>不要改动受管目录内的文件</strong>，否则它会被自动卸载——改完请重新安装。</li>
        <li>WebView2 不提供 <code>chrome.tabs</code> / <code>chrome.windows</code> 与扩展工具栏，
          依赖这些能力的扩展可能无法完整工作。</li>
      </ul>
    </div>

    <div class="list" id="list"></div>
  </div>

  <script src="../common/browser-api.js"></script>
  <script src="extensions.js"></script>
</body>

</html>
