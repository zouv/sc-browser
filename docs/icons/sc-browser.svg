<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">ScBrowser</title>
  <defs>
    <linearGradient id="rim" x1="97" y1="50" x2="407" y2="474" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65D9F5"/>
      <stop offset=".5" stop-color="#348BDC"/>
      <stop offset="1" stop-color="#596DF0"/>
    </linearGradient>
    <linearGradient id="disc" x1="108" y1="27" x2="387" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#196EAC"/>
      <stop offset=".52" stop-color="#193C82"/>
      <stop offset="1" stop-color="#1E286A"/>
    </linearGradient>
    <linearGradient id="orbit" x1="140" y1="108" x2="369" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#95FFE2"/>
      <stop offset=".49" stop-color="#4CDEF6"/>
      <stop offset="1" stop-color="#7AA4FF"/>
    </linearGradient>
    <linearGradient id="ice" x1="213" y1="158" x2="321" y2="351" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEEFF"/>
    </linearGradient>
  </defs>
  <!-- 透明留边和一层干净的轮廓，兼顾浅色与深色背景。 -->
  <circle cx="256" cy="256" r="242" fill="url(#rim)"/>
  <circle cx="256" cy="256" r="233" fill="url(#disc)"/>
  <!-- C 即航迹；右上方的开口和斜切端点保留浏览器的导航意象。 -->
