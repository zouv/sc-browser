<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title description">
  <title id="title">SC-Browser application icon</title>
  <desc id="description">A custom SC monogram with an icy-blue S and a cyan C, surrounded by a subtle orbital line on a rounded midnight-blue tile.</desc>
  <defs>
    <linearGradient id="tile" x1="70" y1="30" x2="430" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172A48"/>
      <stop offset="0.5" stop-color="#0E1A31"/>
      <stop offset="1" stop-color="#080F20"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(362 156) rotate(122) scale(324 280)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#187BAD" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#187BAD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="78" y1="22" x2="421" y2="489" gradientUnits="userSpaceOnUse">
      <stop stop-color="#96DFFF" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#96DFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#96DFFF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="s-ink" x1="134" y1="150" x2="241" y2="355" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#DEF7FF"/>
      <stop offset="1" stop-color="#8CCBFF"/>
    </linearGradient>
    <linearGradient id="c-ink" x1="319" y1="156" x2="391" y2="344" gradientUnits="userSpaceOnUse">
      <stop stop-color="#74F6E5"/>
      <stop offset="0.48" stop-color="#2DCCF4"/>
      <stop offset="1" stop-color="#4985FF"/>
    </linearGradient>
    <linearGradient id="orbit-ink" x1="90" y1="332" x2="438" y2="164" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5086FF" stop-opacity="0.04"/>
      <stop offset="0.52" stop-color="#58C7FF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7AF7E9" stop-opacity="0.65"/>
    </linearGradient>
    <clipPath id="tile-clip"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>
  <!-- Background tile; pixels outside its rounded corners remain transparent. -->
  <g id="background">
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#ambient)"/>
    <rect x="17" y="17" width="478" height="478" rx="111" stroke="url(#edge)" stroke-width="2"/>
  </g>
  <!-- The tilted orbit adds motion without competing with the letterforms. -->
  <g id="orbit" clip-path="url(#tile-clip)">
    <ellipse cx="256" cy="256" rx="201" ry="114" transform="rotate(-25 256 256)" stroke="url(#orbit-ink)" stroke-width="2.5"/>
    <path d="M 408 136 C 424 139 434 148 438 161" stroke="#7AF7E9" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
    <circle cx="438" cy="161" r="5.5" fill="#8DFFF1"/>
  </g>
  <!-- Hand-drawn Bezier letters: no fonts or external resources required. -->
  <g id="monogram" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path id="letter-s" d="M 237 179 C 216 155 174 151 146 168 C 116 186 117 219 150 237 L 210 266 C 246 283 246 316 216 337 C 189 356 147 351 122 327" stroke="url(#s-ink)"/>
    <path id="letter-c" d="M 399 181 C 374 155 334 151 306 179 C 277 209 277 288 306 320 C 333 350 373 350 399 322" stroke="url(#c-ink)"/>
  </g>
</svg>
