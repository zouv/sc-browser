    L 401.4 338.1 Q 407.3 339.1 403.9 345.2
    A 177 177 0 1 1 368.8 123.9 Z"/>
  <path id="letter-s" fill="url(#ice)" d="M 335 180
    Q 339 184 335 188 L 313 210 Q 309 214 305 210
    C 293 200 279 195 265 195 C 250 195 239 201 239 212
    C 239 225 252 230 275 238 C 316 251 336 266 336 296
    C 336 331 307 353 265 353 C 236 353 209 344 191 327
    Q 187 323 191 319 L 213 296 Q 217 292 221 296
    C 233 307 249 313 266 313 C 283 313 295 307 295 296
    C 295 284 283 278 260 271 C 219 258 198 243 198 213
    C 198 179 226 157 265 157 C 292 157 318 164 335 180 Z"/>
</svg>
